name: CI/CD

on: 
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout 
              uses: actions/checkout@v4  

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build docker image
              run: |
                docker build -t events-api:latest .

            - name: Run image container
              run: |
                docker run -d --name events-api-container -p 5000:5000 events-api:latest
                sleep 5
                curl http://localhost:5000/api/health

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'

            - name: Install dependencies
              run: |
                pip install -r requirements-test.txt

            - name: Run tests
              run: |
                pytest -v
            
            - name: Stop and remove container
              if: always()
              run: |
                docker stop events-api-container
                docker rm events-api-container
    deploy:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        environment: production
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
         
            - name: Login to Docker
              uses: docker/login-action@v3
              with: 
                username: ${{ secrets.DOCKER_HUB_USERNAME }}
                password: ${{ secrets.DOCKER_HUB_PAT }}

            - name: Build and tag docker image
              run: |
                docker build \
                -t ${{ secrets.DOCKER_HUB_USERNAME }}/events-api:latest .

                docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/events-api:latest \
                 ${{ secrets.DOCKER_HUB_USERNAME }}/events-api:${{ github.sha }}
            
            - name: Push docker image
              run: docker push \
                docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/events-api:${{ github.sha }}
            
            - name: Trigger render deployment
              run: | 
                curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
                sleep 5

